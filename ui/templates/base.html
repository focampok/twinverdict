<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TwinVerdict</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
        background: #fff;
        color: #1a1a1a;
        max-width: 56rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .badge {
        display: inline-block;
        margin: 0 0 1rem;
        padding: 0.35rem 0.7rem;
        border: 2px solid #1a1a1a;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.35;
      }
      .provenance { margin-top: 0; }
      h1 { font-size: 1.6rem; line-height: 1.3; }
      .secondary { color: #444; font-size: 0.95rem; }
      .error { color: #8a1f1f; }
      button { font: inherit; padding: 0.4rem 0.8rem; margin-right: 0.5rem; }
      input { font: inherit; padding: 0.35rem 0.5rem; margin: 0 0.5rem 0.75rem 0; }
      h2 { font-size: 1.25rem; margin-top: 2.5rem; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      th, td { border-bottom: 1px solid #ccc; text-align: left; padding: 0.35rem 0.45rem; white-space: nowrap; }
      canvas { width: 100%; max-height: 320px; }
      .honesty { color: #333; }
      fieldset { border: 1px solid #ccc; margin: 0 0 1rem; padding: 0.5rem 0.9rem 0.25rem; }
      legend { font-weight: 650; padding: 0 0.3rem; }
      select { font: inherit; padding: 0.3rem 0.4rem; margin: 0 0 0.75rem 0.4rem; }
      .slider { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
      .slider input { flex: 0 1 14rem; margin: 0; }
      .slider output { font-variant-numeric: tabular-nums; min-width: 2.5rem; }
      tr.mine td { font-weight: 650; }
      .gantt-box { background: var(--bg); color: var(--text); padding: 0.75rem 1rem 1rem; margin-top: 1.25rem; }
      .gantt-box h3 { font-size: 1rem; margin: 0.7rem 0 0.3rem; }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
