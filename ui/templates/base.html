<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TwinVerdict</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
        color: #1a1a1a;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .badge {
        display: inline-block;
        margin: 0 0 1rem;
        padding: 0.25rem 0.7rem;
        border: 2px solid #1a1a1a;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .provenance { margin-top: 0; }
      h1 { font-size: 1.6rem; line-height: 1.3; }
      .secondary { color: #444; font-size: 0.95rem; }
      .error { color: #8a1f1f; }
      button { font: inherit; padding: 0.4rem 0.8rem; margin-right: 0.5rem; }
      input { font: inherit; padding: 0.35rem 0.5rem; margin: 0 0.5rem 0.75rem 0; }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
