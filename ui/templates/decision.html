<div id="decision" class="decision" data-status="{{ decision_label | lower }}">
  <h3>Your decision</h3>
  <p class="status">
    <span class="pill pill-{{ decision_label | lower }}">{{ decision_label }}</span>
    {% if decision_reason %}
      <span class="reason">Reason: {{ decision_reason }}</span>
    {% endif %}
  </p>
  {% if policy_id %}
    <form class="decide">
      <label class="reason-field">
        <span>Reason (optional)</span>
        <input name="reason" type="text" placeholder="e.g. ready for the next shift" />
      </label>
      <div class="decide-buttons">
        <button
          type="button"
          class="btn-good"
          hx-post="/policies/{{ policy_id }}/approve"
          hx-target="#decision"
          hx-swap="outerHTML"
          hx-include="closest form"
          hx-disabled-elt="this"
        >Approve</button>
        <button
          type="button"
          class="btn-down"
          hx-post="/policies/{{ policy_id }}/reject"
          hx-target="#decision"
          hx-swap="outerHTML"
          hx-include="closest form"
          hx-disabled-elt="this"
        >Reject</button>
      </div>
    </form>
  {% endif %}
</div>
